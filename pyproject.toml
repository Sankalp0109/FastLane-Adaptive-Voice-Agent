[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastlane"
version = "0.1.0"
description = "FastLane: per-turn routing between a fine-tuned small model and a large model in a voice booking agent"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
large = ["anthropic>=0.40"]
small = ["openai>=1.40"]
train = ["torch", "transformers>=4.45", "peft>=0.12", "trl>=0.11", "datasets", "bitsandbytes"]
eval = ["matplotlib"]
speech = ["pipecat-ai", "faster-whisper", "jiwer"]

[project.scripts]
fastlane = "fastlane.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fastlane = ["world/schema.sql", "retrieval/docs/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
